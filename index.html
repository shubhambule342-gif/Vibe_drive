/* drive */
const $=id=>document.getElementById(id);
const K={l:0,r:0,u:0,d:0},KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',' ':'d'};
let s=0,v=0,lat=1.9,psi=0,st=0,camYaw=0,roll=0,pitchS=0,wA=0,lastS=-1e9,lastC=[1e9,0],first=true,last=0,pth=0;
const thR=q=>Math.atan2(-(xr(-q-1)-xr(-q+1))/2,1);
addEventListener('keydown',e=>{const k=KM[e.key];if(k){K[k]=1;e.preventDefault();return}
 const c=e.key.toLowerCase();if(c==='m')$('mini').click();else if(c==='p')togglePlay();else if(c==='n')next();else if(c==='b')prev()});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)K[k]=0});
addEventListener('blur',()=>{K.l=K.r=K.u=K.d=0});

setTimeout(()=>$('hint').style.opacity=0,10000);
document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(20,10,0,.35) 100%)"></div>');
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||.016);last=t;
 const sg=(K.r?1:0)-(K.l?1:0);st+=(sg-st)*Math.min(1,dt*(sg?5:8));
 if(K.u&&v<55)v+=(9-v*.14)*dt;else if(!K.u)v-=(1.2+v*.035)*dt;
 if(K.d)v-=16*dt;
 if(Math.abs(lat)>5)v-=(4+v*.25)*dt;
 v=Math.max(0,Math.min(55,v));
 const kap=(thR(s+2)-thR(s-2))/4,turn=-st*Math.min(.7,9/Math.max(v,1))*(v/(v+4));
 psi+=(turn-v*kap*.25-psi)*dt;psi=Math.max(-1,Math.min(1,psi));
 lat-=v*Math.sin(psi)*dt;lat=Math.max(-32,Math.min(32,lat));s+=v*Math.cos(psi)*dt;
 const z=-s,thr=thR(s),thc=thr+psi,px=xr(z)+Math.cos(thr)*lat,pz=z-Math.sin(thr)*lat;
 const fx=-Math.sin(thc),fz=-Math.cos(thc),py=H(px,pz)+.1*(1-sm(4.2,5.5,Math.abs(lat)))+Math.sin(s*.9)*.004*Math.min(1,v/10);
 const pit=Math.atan((H(px+fx*1.4,pz+fz*1.4)-H(px-fx*1.4,pz-fz*1.4))/2.8)+(K.u?.012:0)-(K.d&&v>2?.02:0);
 pitchS+=(pit-pitchS)*Math.min(1,dt*8);
 if(first){pth=thc;camYaw=thc}
 const yr_=(thc-pth)/dt;pth=thc;roll+=(Math.max(-.06,Math.min(.06,-yr_*v*.0067))-roll)*Math.min(1,dt*3);
 car.position.set(px,py,pz);car.rotation.set(pitchS,thc,roll,'YXZ');
 wA+=v*dt/.36;wheels.forEach(w=>w.rotation.z=-wA);
 camYaw+=(thc-camYaw)*(1-Math.exp(-dt*2.4));
 const dist=7.4+v*.03,tx=px+Math.sin(camYaw)*dist,ty=py+2.5,tz=pz+Math.cos(camYaw)*dist;
 if(first)cam.position.set(tx,ty,tz);else cam.position.lerp(new T.Vector3(tx,ty,tz),1-Math.exp(-dt*7));

 cam.lookAt(px-Math.sin(camYaw)*5,py+1,pz-Math.cos(camYaw)*5);
 if(Math.hypot(px-lastC[0],pz-lastC[1])>12){regenTerrain(px,pz);regenVeg(px,pz);lastC=[px,pz]}
 const sb=Math.floor(s/3);if(sb!==lastS){regenRoad(sb*3);lastS=sb}
 sun.position.set(px+sunDir.x*150,py+sunDir.y*150,pz+sunDir.z*150);sun.target.position.set(px,py,pz);
 sky.position.copy(cam.position);skyU.t.value=t/1000;first=false;
 renderer.render(scene,cam)}
requestAnimationFrame(frame);
/* music */
const au=new Audio();au.preload='auto';au.volume=.8;
let tr=[],cur=-1,shuf=false,rep=0;
const PL='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',PA='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const fmt=q=>isFinite(q)?Math.floor(q/60)+':'+String(Math.floor(q%60)).padStart(2,'0'):'0:00';
function art(el,name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%360;el.style.background='linear-gradient(135deg,hsl('+h+',62%,46%),hsl('+((h+55)%360)+',70%,24%))';el.textContent=(name.trim()[0]||'♪').toUpperCase()}
function fill(el){el.style.setProperty('--p',(el.value-el.min)/(el.max-el.min)*100+'%')}
function addFiles(fs){[...fs].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|flac|aac|opus)$/i.test(f.name)).forEach(f=>{
  let n=f.name.replace(/\.[^.]+$/,''),ar='Local file',i=n.indexOf(' - ');if(i>0){ar=n.slice(0,i);n=n.slice(i+3)}
  tr.push({title:n,artist:ar,url:URL.createObjectURL(f)})});
 const f0=cur<0&&tr.length;draw();if(f0)play(0)}
function play(i){if(!tr[i])return;cur=i;au.src=tr[i].url;au.play().catch(()=>{});draw()}
function next(){if(!tr.length)return;let i=(cur+1)%tr.length;if(shuf&&tr.length>1){do{i=Math.floor(Math.random()*tr.length)}while(i===cur)}play(i)}
function prev(){if(!tr.length)return;if(au.currentTime>3){au.currentTime=0;return}play((cur-1+tr.length)%tr.length)}
function togglePlay(){if(cur<0){if(tr.length)play(0);return}au.paused?au.play().catch(()=>{}):au.pause()}
function rem(i){URL.revokeObjectURL(tr[i].url);const was=i===cur;tr.splice(i,1);
 if(was){if(tr.length)play(Math.min(i,tr.length-1));else{au.pause();au.removeAttribute('src');cur=-1;$('seek').value=0;fill($('seek'));$('t1').textContent=$('t2').textContent='0:00'}}else if(i<cur)cur--;draw()}
function draw(){const ul=$('list');ul.innerHTML='';
 tr.forEach((t,i)=>{const li=document.createElement('li');if(i===cur)li.className='cur'+(au.paused?'':' pl');
  const a=document.createElement('div');a.className='art';art(a,t.title);
  const m=document.createElement('div');m.className='meta';m.innerHTML='<div class="tt"></div><div class="ar"></div>';m.firstChild.textContent=t.title;m.lastChild.textContent=t.artist;
  const eq=document.createElement('div');eq.className='eq';eq.innerHTML='<i></i><i></i><i></i>';
  const b=document.createElement('button');b.className='rm';b.textContent='✕';b.setAttribute('aria-label','Remove '+t.title);b.onclick=e=>{e.stopPropagation();rem(i)};
  li.onclick=()=>play(i);li.append(a,m,eq,b);ul.append(li)});

 const c=tr[cur];$('nt').textContent=c?c.title:'Nothing playing';$('na').textContent=c?c.artist:'Add songs to start';
 if(c)art($('art'),c.title);else{$('art').style.background='#282828';$('art').textContent='♪'}
 $('ht').textContent=$('mp').classList.contains('min')&&c?c.title:'Playlist'}
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('pv').onclick=prev;$('nx').onclick=next;$('pp').onclick=$('pp2').onclick=togglePlay;
$('sh').onclick=function(){shuf=!shuf;this.classList.toggle('on',shuf)};
$('rp').onclick=function(){rep=(rep+1)%3;this.classList.toggle('on',rep<2);this.setAttribute('aria-label',['Repeat: all','Repeat: one','Repeat: off'][rep]);this.style.opacity=rep===1?'1':'';this.title=['Repeat all','Repeat one','Repeat off'][rep]};
$('mini').onclick=()=>{const m=$('mp').classList.toggle('min');$('mini').setAttribute('aria-expanded',!m);draw()};
$('vol').oninput=e=>{au.volume=e.target.value/100;fill(e.target)};

['seek','vol'].forEach(id=>$(id).addEventListener('change',e=>e.target.blur()));
au.onended=()=>{if(rep===1){au.currentTime=0;au.play().catch(()=>{})}else if(rep===2&&cur===tr.length-1&&!shuf){au.pause()}else next()};
au.onplay=au.onpause=()=>{$('pp').innerHTML=$('pp2').innerHTML=au.paused?PL:PA;draw()};
